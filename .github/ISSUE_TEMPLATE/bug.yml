name: Bug report
description: Report an incorrect, confusing, or unsafe behavior using a synthetic reproduction.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private repository text, secrets, credentials, or personal filesystem paths.
        Use a minimal synthetic fixture.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-docs-doctor --version` or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal files and exact command needed to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safety confirmation
      options:
        - label: This report contains no secrets, private source documents, or personal paths.
          required: true
