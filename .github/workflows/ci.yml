name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and development checks
        run: python -m pip install ".[dev]"

      - name: Unit and fixture suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v

      - name: Lint and format
        env:
          RUFF_NO_CACHE: "true"
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests

      - name: Type check
        run: pyright

      - name: Cache-free syntax check
        run: python -B scripts/check_python_syntax.py src scripts tests

      - name: CLI contract
        run: |
          agent-docs-doctor --version
          agent-docs-doctor doctor
          agent-docs-doctor audit fixtures/healthy-repo --format text

      - name: No-write proof
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/check_no_write.py fixtures/healthy-repo

      - name: Public safety scan
        run: python -B scripts/public_safety_scan.py .

      - name: Minimum build backend
        run: |
          python -m pip install "setuptools==77.0.3" wheel
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir "${{ runner.temp }}/minimum-backend-wheel"

      - name: Build wheel and source distribution outside the checkout
        run: python -m build --outdir "${{ runner.temp }}/agent-docs-doctor-dist"
