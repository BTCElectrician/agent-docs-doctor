[project]
name = "agent-docs-doctor"
version = "0.1.0"
description = "Evidence-first audits for agent-facing repository documentation"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
extraPaths = ["scripts"]
